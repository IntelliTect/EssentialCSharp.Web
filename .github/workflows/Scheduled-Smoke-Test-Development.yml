name: Scheduled smoke test (Development)

# Runs the deployed smoke tests against the development site between deployments, to catch drift that
# no code change triggers: expiring secrets or Key Vault access, external login configuration, content,
# or the site going down. Deployments run the same tests as a gate (Build-Test-And-Deploy.yml).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately not the deploy-development group: a queued run there would cancel a pending deployment.
  group: scheduled-dev-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No expected commit: between deployments dev may be on any recent build; /version must still answer.
      - name: Smoke test development
        id: smoke
        env:
          E2E_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dev.essentialcsharp.com' }}
        run: >-
          dotnet test --project EssentialCSharp.Web.E2ETests/EssentialCSharp.Web.E2ETests.csproj
          --configuration Release
          -- --treenode-filter "/*/*/*/*[Category=Deployed]"
          --report-trx --results-directory "${{ runner.temp }}/smoke-results"

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: ${{ runner.temp }}/smoke-results
          if-no-files-found: ignore

      - name: Report result
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A setup failure (smoke step skipped) also counts as a failure: dev isn't being monitored either way,
          # and it keeps this outcome consistent with the run's conclusion, which the next run reads.
          OUTCOME: ${{ job.status == 'cancelled' && 'cancelled' || (steps.smoke.outcome == 'success' && 'success' || 'failure') }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: Scheduled-Smoke-Test-Development.yml
          BRANCH: main
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dev.essentialcsharp.com' }}
        run: bash scripts/report-scheduled-smoke-result.sh
