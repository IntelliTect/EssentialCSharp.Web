name: Build, Test, and Deploy EssentialCSharp.Web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-test-deploy-pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Build frontend (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Node version matches the Docker build
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          expected_node_version="$(tr -d '[:space:]' < EssentialCSharp.Web/.nvmrc)"
          docker_node_version="$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' EssentialCSharp.Web/Dockerfile | head -n 1)"
          if [[ "$expected_node_version" != "$docker_node_version" ]]; then
            echo "::error::EssentialCSharp.Web/.nvmrc specifies Node $expected_node_version, but the Dockerfile uses Node $docker_node_version."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EssentialCSharp.Web/.nvmrc
          cache: npm
          cache-dependency-path: EssentialCSharp.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: EssentialCSharp.Web
        run: npm ci

      - name: Build frontend
        working-directory: EssentialCSharp.Web
        run: npm run build

      # The .NET jobs build with SkipFrontendBuild; the browser journey tests need the compiled frontend.
      - name: Upload frontend build
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: EssentialCSharp.Web/wwwroot/dist
          retention-days: 5
          if-no-files-found: error

  build-and-test:
    name: Build and test (Ubuntu)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: "BuildAndUploadImage"
    permissions:
      contents: read
      id-token: write # OIDC sign-in for the private NuGet feed (container build only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The host build and tests use placeholder content (AccessToNugetFeed=false), so they need no
      # private-feed credentials and share the public NuGet cache with PR builds.
      - name: Set up dependency caching for faster builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nuget-cache
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/**/obj/project.assets.json
          key: ${{ runner.os }}-nuget-public-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-public-

      - name: Restore with dotnet
        run: dotnet restore /p:AccessToNugetFeed=false

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: EssentialCSharp.Web/wwwroot/dist

      - name: Build with dotnet
        run: dotnet build -p:ContinuousIntegrationBuild=True -p:ReleaseDateAttribute=True -p:SkipFrontendBuild=true -p:AccessToNugetFeed=false --configuration Release --no-restore

      - name: Install Playwright Chromium for journey tests
        run: pwsh dev/EssentialCSharp.Web.AppHost.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run .NET Tests
        run: dotnet test --no-build --configuration Release

      - name: Upload Playwright failure captures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-captures-${{ github.run_attempt }}
          path: dev/EssentialCSharp.Web.AppHost.Tests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # Credentialed build: its NuGet cache mount holds private-feed packages, so it uses the
      # buildkit-cache-feed- prefix. PR builds use buildkit-cache-public- and never fall back to it.
      - name: Restore BuildKit cache mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: buildkit-cache
        with:
          path: buildkit-cache
          key: buildkit-cache-feed-${{ hashFiles('EssentialCSharp.Web/Dockerfile', 'Directory.Packages.props', '**/*.csproj', 'EssentialCSharp.Web/package-lock.json') }}
          restore-keys: buildkit-cache-feed-

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: EssentialCSharp.Web/Dockerfile
          cache-dir: buildkit-cache
          skip-extraction: false

      - name: Azure login for the private NuGet feed
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_DEVOPS_FEED_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Credentials-only NuGet.Config passed as a BuildKit secret; the repo nuget.config supplies the sources.
      - name: Generate Docker NuGet credentials config
        run: |
          NUGET_FEED_TOKEN="$(bash scripts/nuget/get-feed-token.sh)"
          export NUGET_FEED_TOKEN
          mkdir -p "${RUNNER_TEMP}/nuget"
          bash scripts/nuget/emit-creds-config.sh > "${RUNNER_TEMP}/nuget/NuGet.Config"
          chmod 600 "${RUNNER_TEMP}/nuget/NuGet.Config"

      # Only build for dev registry — prod gets the image via az acr import in deploy-production
      - name: Build Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ vars.DEVCONTAINER_REGISTRY }}/essentialcsharpweb:${{ github.sha }},${{ vars.DEVCONTAINER_REGISTRY }}/essentialcsharpweb:latest
          file: ./EssentialCSharp.Web/Dockerfile
          context: .
          secret-files: |
            "nuget_config=${{ runner.temp }}/nuget/NuGet.Config"
          build-args: SOURCE_REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ github.workspace }}/essentialcsharpwebimage.tar
          cache-from: type=gha,scope=essentialcsharpweb-main
          cache-to: type=gha,mode=max,scope=essentialcsharpweb-main

      - name: Remove Docker NuGet credentials config
        if: always()
        run: rm -f "${RUNNER_TEMP}/nuget/NuGet.Config"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: essentialcsharpwebimage
          path: ${{ github.workspace }}/essentialcsharpwebimage.tar

  pr-build-and-test:
    name: Build and test (${{ matrix.runner }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: frontend-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            collect_coverage: true
          - runner: macos-latest
            collect_coverage: false
          - runner: windows-latest
            collect_coverage: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/**/obj/project.assets.json
          # Public packages only (AccessToNugetFeed=false); the same cache main's host build uses.
          key: ${{ runner.os }}-nuget-public-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-public-

      - name: Restore .NET dependencies
        run: dotnet restore /p:AccessToNugetFeed=false

      # Browser journey tests need Linux containers, so they only run on the Ubuntu leg (skipped elsewhere).
      - name: Download frontend build
        if: matrix.collect_coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: EssentialCSharp.Web/wwwroot/dist

      - name: Build .NET
        run: dotnet build --configuration Release --no-restore /p:AccessToNugetFeed=false /p:SkipFrontendBuild=true

      - name: Install Playwright Chromium for journey tests
        if: matrix.collect_coverage
        run: pwsh dev/EssentialCSharp.Web.AppHost.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Restore local .NET tools
        if: matrix.collect_coverage
        run: dotnet tool restore

      - name: Check for pending EF Core model changes
        if: matrix.collect_coverage
        run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project EssentialCSharp.Web --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Expose GitHub Actions Runtime
        if: matrix.collect_coverage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run .NET tests
        run: dotnet test --no-build --configuration Release ${{ matrix.collect_coverage && format('--report-trx --coverage --results-directory {0}', runner.temp) || '' }}

      - name: Upload Playwright failure captures
        if: ${{ failure() && matrix.collect_coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-captures-${{ github.run_attempt }}
          path: dev/EssentialCSharp.Web.AppHost.Tests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Convert TRX to VS Playlist
        if: ${{ failure() && matrix.collect_coverage }}
        uses: BenjaminMichaelis/trx-to-vsplaylist@e8d6bf4721d96b95a5de0a4c0b302c09be97abaa # v5
        with:
          trx-file-path: '${{ runner.temp }}/*.trx'
          output-directory: '${{ runner.temp }}/vsplaylists'

  container-validation:
    name: Build container image
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [frontend-build, pr-build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # Uncredentialed build: only ever restore buildkit-cache-public- entries (this PR's own), never
      # main's credentialed buildkit-cache-feed- entries or the legacy buildkit-cache-<hash> ones.
      - name: Restore BuildKit cache mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: buildkit-cache
        with:
          path: buildkit-cache
          key: buildkit-cache-public-${{ hashFiles('EssentialCSharp.Web/Dockerfile', 'Directory.Packages.props', '**/*.csproj', 'EssentialCSharp.Web/package-lock.json') }}
          restore-keys: buildkit-cache-public-

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: EssentialCSharp.Web/Dockerfile
          cache-dir: buildkit-cache
          skip-extraction: ${{ steps.buildkit-cache.outputs.cache-hit }}

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./EssentialCSharp.Web/Dockerfile
          context: .
          push: false
          cache-from: |
            type=gha,scope=essentialcsharpweb-main
            type=gha,scope=essentialcsharpweb-pr
          cache-to: type=gha,mode=min,scope=essentialcsharpweb-pr
          build-args: |
            ACCESS_TO_NUGET_FEED=false
            SOURCE_REVISION=${{ github.sha }}

  deploy-development:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    environment:
      name: "Development"
    permissions:
      id-token: write
      contents: read
    outputs:
      # Registry manifest digest of the image this run built and pushed; production promotes exactly this.
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: essentialcsharpwebimage
          path: ${{ github.workspace }}

      - name: Load image
        run: |
          docker load --input ${{ github.workspace }}/essentialcsharpwebimage.tar
          docker image ls -a

      - name: Log in to container registry
        run: |
          REGISTRY="${{ vars.DEVCONTAINER_REGISTRY }}"
          az acr login --name "${REGISTRY%.azurecr.io}"

      - name: Push Image to Dev Container Registry
        id: push
        env:
          IMAGE: ${{ vars.DEVCONTAINER_REGISTRY }}/essentialcsharpweb
        run: |
          docker push --all-tags "$IMAGE"
          # Digest of what was just pushed; later steps deploy by digest, never by tag.
          DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No pushed digest for $IMAGE:$GITHUB_SHA"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          MIGRATION_IMAGE: ${{ vars.DEVCONTAINER_REGISTRY }}/essentialcsharpweb@${{ steps.push.outputs.digest }}
          MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: bash scripts/run-ef-migration-job.sh

      - name: Deploy to Container App
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCEGROUP" \
            --image "${{ vars.DEVCONTAINER_REGISTRY }}/essentialcsharpweb@${{ steps.push.outputs.digest }}"

      # Smoke tests stay in this job so it holds the deploy-development concurrency group (no image swap mid-test);
      # deploy-production needs this job, so a failure blocks promotion.
      # Prep runs before the revision wait so it overlaps with the new revision starting up.
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build smoke tests
        run: dotnet build EssentialCSharp.Web.E2ETests/EssentialCSharp.Web.E2ETests.csproj --configuration Release

      - name: Install Playwright Chromium for smoke tests
        run: pwsh EssentialCSharp.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Wait for the new revision to serve this commit
        id: wait-for-revision
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dev.essentialcsharp.com' }}
        run: bash scripts/wait-for-deployed-commit.sh "$SITE_BASE_URL" "${{ github.sha }}"

      - name: Show revision status
        if: failure() && steps.wait-for-revision.outcome == 'failure'
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCEGROUP" \
            --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight, health:properties.healthState, running:properties.runningState, image:properties.template.containers[0].image}" \
            --output table

      - name: Smoke test development
        env:
          E2E_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dev.essentialcsharp.com' }}
          E2E_EXPECTED_COMMIT: ${{ github.sha }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: >-
          dotnet test --project EssentialCSharp.Web.E2ETests/EssentialCSharp.Web.E2ETests.csproj
          --configuration Release --no-build
          -- --treenode-filter "/*/*/*/*[Category=Deployed]"
          --report-trx --results-directory "${{ runner.temp }}/smoke-results"

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results
          path: |
            ${{ runner.temp }}/smoke-results
            EssentialCSharp.Web.E2ETests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore

  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [deploy-development]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: "Production"
    permissions:
      id-token: write
      contents: write  # needed for git deploy tag

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Server-side copy from dev ACR to prod ACR — no artifact download needed.
      # Promotes by the digest deploy-development pushed (dev tags are mutable); later steps deploy by digest.
      # PREREQUISITE: prod OIDC identity must have AcrPull on the dev ACR (Terraform RBAC).
      - name: Import image from dev ACR to prod ACR
        id: import
        env:
          DEV_ACR: ${{ vars.DEVCONTAINER_REGISTRY }}
          PROD_ACR: ${{ vars.PRODCONTAINER_REGISTRY }}
          BUILT_DIGEST: ${{ needs.deploy-development.outputs.image-digest }}
        run: |
          [[ "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::deploy-development did not provide a valid image digest (got '$BUILT_DIGEST')"; exit 1; }
          az acr import \
            --name "${PROD_ACR%.azurecr.io}" \
            --source "${DEV_ACR}/essentialcsharpweb@${BUILT_DIGEST}" \
            --image "essentialcsharpweb:${GITHUB_SHA}" \
            --image "essentialcsharpweb:latest" \
            --force
          echo "digest=${BUILT_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          MIGRATION_IMAGE: ${{ vars.PRODCONTAINER_REGISTRY }}/essentialcsharpweb@${{ steps.import.outputs.digest }}
          MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: bash scripts/run-ef-migration-job.sh

      - name: Deploy to Container App
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCEGROUP" \
            --image "${{ vars.PRODCONTAINER_REGISTRY }}/essentialcsharpweb@${{ steps.import.outputs.digest }}"

      - name: Verify deployed image
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: |
          DEPLOYED=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCEGROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          EXPECTED="${{ vars.PRODCONTAINER_REGISTRY }}/essentialcsharpweb@${{ steps.import.outputs.digest }}"
          if [ "$DEPLOYED" != "$EXPECTED" ]; then
            echo "::error::Image mismatch! Expected $EXPECTED but found $DEPLOYED"
            exit 1
          fi
          echo "Deployed image verified: $DEPLOYED"

      - name: Smoke test
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCEGROUP: ${{ vars.RESOURCEGROUP }}
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCEGROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          # --retry-all-errors ensures HTTP 5xx (cold-start 503s) also trigger retries
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors --max-time 30 "https://$FQDN/health"

      - name: Tag commit as deployed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # -f allows re-tagging the same SHA on workflow re-runs
          git tag -f "deployed/prod/${{ github.sha }}"
          git push origin "deployed/prod/${{ github.sha }}" --force
