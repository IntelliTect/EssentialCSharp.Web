name: Setup GitHub Copilot Agent Environment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js for frontend development
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EssentialCSharp.Web/.nvmrc
          cache: npm
          cache-dependency-path: EssentialCSharp.Web/package-lock.json

      - name: Set up dependency caching for faster builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nuget-cache
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/**/obj/project.assets.json
          # Public packages only (AccessToNugetFeed defaults to false), same cache as PR builds.
          key: ${{ runner.os }}-nuget-public-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-public-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install additional development tools
        shell: bash
        run: |
          echo "Installing additional tools for Copilot agent environment..."
          if dotnet tool list --global | grep -q 'dotnet-ef'; then
            dotnet tool update --global dotnet-ef
          else
            dotnet tool install --global dotnet-ef
          fi

      - name: Restore with dotnet
        run: dotnet restore

      - name: Install Aspire CLI bundle
        timeout-minutes: 10
        shell: pwsh
        run: |
          $aspireVersion = (Get-Content aspire.config.json -Raw | ConvertFrom-Json).sdk.version
          if (-not $aspireVersion) { throw "aspire.config.json does not define sdk.version." }
          $installer = "$env:RUNNER_TEMP/aspire-install.sh"
          Invoke-WebRequest https://aspire.dev/install.sh -OutFile $installer
          bash $installer --version $aspireVersion --install-path "$HOME/.aspire/bin" --skip-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$HOME/.aspire/bin" >> $env:GITHUB_PATH
          & "$HOME/.aspire/bin/aspire" --version

      - name: Install npm dependencies
        working-directory: EssentialCSharp.Web
        run: npm ci

      - name: Build frontend
        working-directory: EssentialCSharp.Web
        run: npm run build

      - name: Build with dotnet
        run: dotnet build -p:ContinuousIntegrationBuild=True -p:ReleaseDateAttribute=True -p:SkipFrontendBuild=true --configuration Release --no-restore

      - name: Install Playwright Chromium for journey tests
        run: pwsh dev/EssentialCSharp.Web.AppHost.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run .NET Tests
        run: dotnet test --no-build --configuration Release
