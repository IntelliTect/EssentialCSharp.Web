version: 2
registries:
  nuget-azure-artifacts:
    type: nuget-feed
    url: https://pkgs.dev.azure.com/intelliTect/_packaging/EssentialCSharp/nuget/v3/index.json
    username: ${{secrets.AZURE_DEVOPS_PAT_USERNAME}}
    password: ${{secrets.AZURE_DEVOPS_PAT}}
multi-ecosystem-groups:
  dotnet-sdk-updates:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directories:
      - "/"
      - "/.config"
    registries:
      - nuget-azure-artifacts
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Los_Angeles"
    # Hold public-registry version updates for a few days so a malicious or yanked release is
    # likely to be caught upstream before it is auto-merged. Security updates ignore cooldown.
    # Our own packages are exempt so book content still ships the next day: ContentFeedNuget (private
    # feed) and EssentialCSharp.Shared.Models (nuget.org) share $(ToolingPackagesVersion) and move together.
    cooldown:
      default-days: 3
      semver-major-days: 7
      exclude:
        - "ContentFeedNuget"
        - "EssentialCSharp.Shared.Models"
    groups:
       tooling-dependencies:
          applies-to: version-updates
          patterns:
            - "ContentFeedNuget"
            - "EssentialCSharp.Shared.Models"
       ef-core:
          applies-to: version-updates
          patterns:
            - "Microsoft.EntityFrameworkCore*"
            - "dotnet-ef"

  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # gh-aw action pins are compiler-managed and updated with workflow source updates/recompilation.
      - dependency-name: "github/gh-aw-actions/*"

  - package-ecosystem: "npm"
    directory: "/EssentialCSharp.Web/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: "docker"
    # Look for a `Dockerfile` in the `root` directory
    directory: "/EssentialCSharp.Web/"
    patterns:
      - "*"
    multi-ecosystem-group: "dotnet-sdk-updates"
    # Check for updates once a week
    schedule:
      interval: "weekly"

  - package-ecosystem: "dotnet-sdk"
    # Look for a `global.json` in the `root` directory
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dotnet-sdk-updates"
    # Check for updates once a week
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
